[project]
name = "beep-locator"
version = "0.1.0"
description = "Find a beeping device by turning laptops, phones and tablets into a microphone array"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "segno>=1.6",
    "click>=8.1",
]

[project.scripts]
beep-locator = "beep_locator.cli:cli"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beep_locator*"]

[tool.setuptools.package-data]
beep_locator = ["static/*", "modules/*/*.js"]
